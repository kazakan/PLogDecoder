[package]
name = "plog-cli"
version = "0.1.0"
edition = "2021"

[lib]
name = "plog_cli"
path = "src/lib.rs"

[[bin]]
name = "plog"
path = "src/main.rs"

[dependencies]
plog-core = { path = "../plog-core" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
