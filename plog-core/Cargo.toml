[package]
name = "plog-core"
version = "0.0.1"
edition = "2021"

[dependencies]
regex = "1"
once_cell = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
indexmap = "2"
rayon = "1.12.0"
memmap2 = "0.9.11"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "benchmarks"
harness = false
