# CD — Continuous Delivery / Release
#
# Triggered when a PR labelled "release" is merged into main.
# Reads the version from Cargo.toml, creates a Git tag (vX.Y.Z),
# and publishes a GitHub Release with pre-built binaries.
#
# Requirements:
#   - The PR must carry the "release" label.
#   - Cargo.toml [package].version must be bumped to the target version before
#     merging.
#   - The GITHUB_TOKEN secret is used automatically by the runner.

name: CD

on:
  pull_request:
    types: [closed]
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Tag & Release
    if: |
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create tags and releases

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can push a tag

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      # -----------------------------------------------------------------------
      # Read version from Cargo.toml
      # -----------------------------------------------------------------------
      - name: Read version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "TAG=v${VERSION}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Build release binaries
      # -----------------------------------------------------------------------
      - name: Build (release)
        run: cargo build --release --all-features

      # -----------------------------------------------------------------------
      # Create and push the version tag
      # -----------------------------------------------------------------------
      - name: Create Git tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.TAG }}" \
                  -m "Release ${{ steps.version.outputs.TAG }}"
          git push origin "${{ steps.version.outputs.TAG }}"

      # -----------------------------------------------------------------------
      # Publish GitHub Release
      # -----------------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "plog-core ${{ steps.version.outputs.TAG }}"
          generate_release_notes: true
          files: |
            target/release/libplog_core.rlib
